<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 145 40" fill="none" class="brand-svg">
  <!-- ABP Block Emblem -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="28" height="28" rx="4" fill="currentColor"/>
    <text x="14" y="20" font-family="'Inter Tight', sans-serif" font-size="15" font-weight="900" fill="var(--paper)" text-anchor="middle" letter-spacing="-0.02em">abp</text>
    <rect x="20" y="3" width="5" height="5" rx="1" fill="var(--accent)"/>
  </g>
  <!-- Text -->
  <text x="44" y="20" font-family="'Inter Tight', sans-serif" font-size="13" font-weight="700" letter-spacing="0.04em" fill="currentColor">ABP News</text>
  <text x="44" y="29" font-family="'IBM Plex Mono', monospace" font-size="6" font-weight="500" letter-spacing="0.08em" text-transform="uppercase" fill="currentColor" opacity="0.75">Network</text>
</svg>
